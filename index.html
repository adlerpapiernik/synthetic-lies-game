<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Synthetic Lies</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    font-family: 'Orbitron', sans-serif;
    background: #04111f;
  }

  /* ── BACKGROUND ── */
  .bg {
    position: fixed;
    inset: 0;
    background: url('background-final.png') center center / cover no-repeat;
    z-index: 0;
  }

  /* ── HERO ── */
  .hero {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    gap: 2rem;
  }

  /* ── TITLE ── */
  h1 {
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: clamp(2.2rem, 6vw, 5rem);
    letter-spacing: 0.05em;
    color: #ffffff;
    text-shadow:
      0 2px 12px rgba(0,0,0,0.8),
      0 0 40px rgba(255,255,255,0.15);
  }

  /* ── SUBHEADER ── */
  .subheader {
    font-family: 'Orbitron', sans-serif;
    font-weight: 400;
    font-size: clamp(0.6rem, 1.6vw, 0.9rem);
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.7);
    margin-top: -1.4rem;
    text-shadow: 0 1px 6px rgba(0,0,0,0.8);
  }

  /* ── BUTTON ── */
  .play-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 1rem 3.5rem;
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
    font-size: clamp(0.75rem, 1.6vw, 1rem);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #1a4fd6;
    background: #ffffff;
    border: none;
    cursor: pointer;
    text-decoration: none;
    transition: transform 0.18s ease, box-shadow 0.18s ease;
    box-shadow: 0 2px 16px rgba(0,0,0,0.4);
  }

  .play-btn:hover {
    transform: scale(1.04) translateY(-2px);
    box-shadow: 0 6px 32px rgba(0,0,0,0.5);
    color: #0f3ab8;
  }

  .play-btn:active {
    transform: scale(0.97);
  }
</style>
</head>
<body>

<div class="bg"></div>

<main class="hero">
  <h1>Synthetic Lies</h1>
  <p class="subheader">Your Mission Awaits</p>
  <!-- UPDATE href to your Unity WebGL build path -->
  <a class="play-btn" href="Build/index.html">Start Game</a>
</main>

</body>
</html>
