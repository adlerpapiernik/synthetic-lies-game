<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Synthetic Lies</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Audiowide&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    font-family: 'Orbitron', sans-serif;
    background: #04111f;
  }

  /* ── BACKGROUND IMAGE ── */
  .bg {
    position: fixed;
    inset: 0;
    background: url('ChatGPT_Image_Jun_28__2026__07_48_33_PM.png') center center / cover no-repeat;
    z-index: 0;
    animation: slow-drift 30s ease-in-out infinite alternate;
    transform-origin: center center;
  }

  @keyframes slow-drift {
    0%   { transform: scale(1.08) translate(0px, 0px); }
    25%  { transform: scale(1.10) translate(-12px, -8px); }
    50%  { transform: scale(1.09) translate(8px, -14px); }
    75%  { transform: scale(1.11) translate(-6px, 10px); }
    100% { transform: scale(1.08) translate(10px, 6px); }
  }

  /* ── OVERLAY ── */
  .overlay {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 50% 50%,
        rgba(4, 17, 31, 0.10) 0%,
        rgba(4, 17, 31, 0.45) 55%,
        rgba(4, 17, 31, 0.80) 100%);
    z-index: 1;
    pointer-events: none;
  }

  /* ── HERO ── */
  .hero {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    text-align: center;
    padding: 2rem;
  }

  /* ── TITLE ── */
  .title-wrap {
    margin-bottom: 1.4rem;
  }

  .title-wrap::before {
    content: '';
    display: block;
    width: 320px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
    margin: 0 auto 1.1rem;
  }

  .title-wrap::after {
    content: '';
    display: block;
    width: 320px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
    margin: 1.1rem auto 0;
  }

  h1 {
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: clamp(2.4rem, 7.5vw, 5.5rem);
    letter-spacing: 0.08em;
    line-height: 1.05;
    color: #ffffff;
    text-shadow:
      0 0 20px rgba(255,255,255,0.6),
      0 0 60px rgba(180,220,255,0.25),
      0 2px 8px rgba(0,0,0,0.95);
    animation: pulse-glow 4s ease-in-out infinite alternate;
  }

  @keyframes pulse-glow {
    0%   { text-shadow: 0 0 20px rgba(255,255,255,0.5), 0 0 50px rgba(180,220,255,0.2), 0 2px 8px rgba(0,0,0,0.95); }
    100% { text-shadow: 0 0 35px rgba(255,255,255,0.9), 0 0 90px rgba(180,220,255,0.4), 0 2px 8px rgba(0,0,0,0.95); }
  }

  /* ── SUBHEADER ── */
  .subheader {
    font-family: 'Orbitron', sans-serif;
    font-weight: 400;
    font-size: clamp(0.7rem, 2vw, 1rem);
    letter-spacing: 0.38em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.78);
    margin-bottom: 3rem;
    text-shadow: 0 0 16px rgba(180,220,255,0.5), 0 1px 4px rgba(0,0,0,0.9);
  }

  /* ── START GAME BUTTON ── */
  .play-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 1.1rem 2.8rem;
    font-family: 'Audiowide', sans-serif;
    font-size: clamp(1.2rem, 3vw, 1.9rem);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #1a4fd6;
    background: #ffffff;
    border: none;
    cursor: pointer;
    text-decoration: none;
    position: relative;
    transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    box-shadow:
      0 4px 24px rgba(0,0,0,0.5),
      0 0 0 0 rgba(255,255,255,0);
  }

  .play-btn:hover {
    transform: scale(1.04) translateY(-2px);
    background: #f0f6ff;
    box-shadow:
      0 8px 40px rgba(0,0,0,0.6),
      0 0 30px rgba(255,255,255,0.25);
    color: #0f3ab8;
  }

  .play-btn:active {
    transform: scale(0.97) translateY(0);
  }

  /* ── BOTTOM INDICATOR ── */
  .indicator {
    position: absolute;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    opacity: 0.4;
    animation: bob 2.6s ease-in-out infinite;
  }

  .indicator span {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.5rem;
    letter-spacing: 0.3em;
    color: #ffffff;
    text-transform: uppercase;
  }

  .indicator-line {
    width: 1px; height: 24px;
    background: linear-gradient(to bottom, rgba(255,255,255,0.8), transparent);
  }

  @keyframes bob {
    0%, 100% { transform: translateX(-50%) translateY(0); }
    50%       { transform: translateX(-50%) translateY(7px); }
  }
</style>
</head>
<body>

<div class="bg"></div>
<div class="overlay"></div>

<main class="hero">
  <div class="title-wrap">
    <h1>Synthetic Lies</h1>
  </div>
  <p class="subheader">Your Mission Awaits</p>

  <!-- UPDATE href to point to your Unity WebGL build's index.html -->
  <a class="play-btn" href="Build/index.html">Start Game</a>

  <div class="indicator">
    <div class="indicator-line"></div>
    <span>Enter</span>
  </div>
</main>

</body>
</html>
